# Local development infrastructure only. Not a production deployment.
# The Laravel API and the Next.js web app run natively (see README.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecosystem
      POSTGRES_PASSWORD: ecosystem
      POSTGRES_DB: ecosystem
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosystem"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  redis-data:
